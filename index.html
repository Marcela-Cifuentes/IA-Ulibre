<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de Machine Learning</title>
<style>
:root{
  --bg:#f6f4fa; --card:#ffffff; --ink:#1f1a2e; --muted:#645c78; --line:#ddd7ea;
  --brand:#4b2e83; --brand2:#6b46b3; --soft:#efe9fb; --ok:#1d7a4a; --okbg:#e6f5ec; --bad:#b3261e; --badbg:#fdecea;
  --warn:#8a5a00; --warnbg:#fff4d6; --star:#e0a100; --code:#f1eef8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15111f; --card:#1f1930; --ink:#efeaf9; --muted:#b2a8c8; --line:#3a3153;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea,.permitir{-webkit-user-select:text;user-select:text}
header.top{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#2b2344;color:#efeaf9}}
header.top h1{font-size:1rem;margin:0;font-weight:650;flex:1;min-width:200px}
header.top .who{font-size:.85rem;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.steps{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.step{flex:1;min-width:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:.78rem;text-align:center;color:var(--muted)}
.step b{display:block;font-size:.95rem;color:var(--ink)}
.step.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft);color:var(--brand)}
.step.done{background:var(--okbg);border-color:var(--ok)}
.stars{color:var(--star);letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.25rem}
.card h3{margin:16px 0 6px;font-size:1rem}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.callout{background:var(--soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.callout.warn{background:var(--warnbg);border-color:var(--warn);color:var(--ink)}
.callout.bad{background:var(--badbg);border-color:var(--bad)}
.callout.ok{background:var(--okbg);border-color:var(--ok)}
label.f{display:block;font-weight:600;margin:10px 0 4px;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-height:44px}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.field.bad input,.field.bad select,.item.bad{border-color:var(--bad)}
.item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.item.bad{background:var(--badbg)}
.item p{margin:0 0 8px}
.explica{font-size:.9rem;margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:8px}
.q{margin:14px 0}
.q .t{font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;min-height:44px}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.q.bad .opt{border-color:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--brand);background:var(--brand);color:#fff;padding:10px 16px;min-height:44px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#15111f}}
button.sec{background:transparent;color:var(--brand)}
button.link{background:none;border:none;color:var(--brand);text-decoration:underline;padding:6px 4px;min-height:0;font-weight:500}
button:disabled{opacity:.55;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.token{font:700 1.5rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;background:var(--code);border:2px dashed var(--brand);border-radius:12px;padding:10px 16px;display:inline-block}
.pasos{counter-reset:p;list-style:none;padding:0;margin:8px 0}
.pasos li{counter-increment:p;position:relative;padding:6px 0 6px 38px}
.pasos li:before{content:counter(p);position:absolute;left:0;top:5px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;text-align:center;line-height:26px;font-size:.85rem}

.hint{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--warnbg);font-size:.92rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;font-size:.92rem}
#cover{position:fixed;inset:0;background:var(--brand);color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#cover.on{display:flex}
#cover div{max-width:420px}
#wm{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.07}
@media print{body{display:none!important}}
.sr{position:absolute;left:-9999px}
details.teo{border:1.5px solid var(--line);border-radius:12px;padding:4px 14px;margin:10px 0;background:var(--card)}
details.teo summary{cursor:pointer;font-weight:650;padding:8px 0;color:var(--brand)}
.mx{border-collapse:separate;border-spacing:4px;width:auto;margin:8px 0;font-size:.9rem}
.mx th{border:none;padding:4px 8px;font-weight:600;color:var(--muted);text-align:center}
.mx td{border:2px solid var(--line);border-radius:8px;text-align:center;padding:8px 14px;min-width:84px;font-weight:700}

.mx td.ok{background:var(--okbg);border-color:var(--ok)}
.mx td.er{background:var(--badbg);border-color:var(--bad)}
.mx td.num{background:var(--okbg);border-color:var(--ok)}

.mcard .res{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--okbg);font-size:.92rem}
.mcard .cuando{font-size:.88rem;margin-top:6px}
.sumcheck{font-size:.9rem;margin-top:4px;color:var(--muted)}
tr.bad td{background:var(--badbg)}
.tbl td,.tbl th{padding:6px 8px}

</style>
</head>

    out.appendChild(el('div', { class: 'callout bad' }, [el('b', { text: 'Todavía no. ' }), 'Hay ' + n + ' elemento(s) por revisar (marcados en rojo). Este intento fallido cuenta como un error.']));
    var ex = r.expl || {};
    Object.keys(ex).forEach(function (k) {
      var host = $('qb-' + k) || $('it-' + k);
      if (host && !host.querySelector('.explica')) host.appendChild(el('div', { class: 'explica', text: ex[k] }));
    });
    var first = document.querySelector('.bad'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  st.stars[m - 1] = Math.max(st.stars[m - 1], r.stars); st.passed[m - 1] = true;
  if (r.st) applyState(r.st);
  var box = el('div', { class: 'callout ok' }, [el('b', { text: '¡Misión superada! ' }), el('span', { class: 'stars', text: starsTxt(r.stars) }),
    r.stats && r.stats.entrenamiento != null ? el('div', { text: 'Dato para recordar: en entrenamiento con k=1 acertaste ' + r.stats.entrenamiento + ' de 40.' }) : null]);
  var all = r.all || {};
  var ul = el('ul'); Object.keys(all).forEach(function (k) { ul.appendChild(el('li', { text: all[k] })); });
  box.appendChild(el('div', { class: 'explica' }, [el('b', { text: 'Para llevarte: ' }), ul]));
  var next = el('button', { text: m < 6 ? 'Siguiente misión' : 'Ver resumen' });
  next.addEventListener('click', function () { st.view = m < 6 ? 'm' : 'summary'; st.cur = m < 6 ? m + 1 : 6; save(); render(); window.scrollTo(0, 0); });
  box.appendChild(el('div', { class: 'acts' }, [next]));
  out.appendChild(box); save();
  if (m === 6) revealM6(q);
  [].forEach.call($('form').querySelectorAll('input,select'), function (n) { n.disabled = true; });
  next.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ===== Resumen y PDF ===== */
function summaryView(app) {
  var total = st.stars.reduce(function (a, b) { return a + b; }, 0);
  var card = el('div', { class: 'card' }, [el('h2', { text: 'Resumen de tu laboratorio' }),
    el('p', { class: 'meta', text: st.name + ' · Grupo ' + st.group + ' · Intento ' + st.attempt })]);
  var tb = el('table'); tb.appendChild(el('tr', {}, [el('th', { text: 'Misión' }), el('th', { text: 'Estrellas' })]));
  for (var i = 1; i <= 6; i++) tb.appendChild(el('tr', {}, [el('td', { text: TITULOS[i][0].replace('Misión ' + i + ' · ', 'M' + i + ' · ') }), el('td', { class: 'stars', text: starsTxt(st.stars[i - 1]) })]));
  card.appendChild(tb);
  var box = el('div', { id: 'res' });
  card.appendChild(box);
  app.appendChild(card);
  var fin = el('button', { text: 'Obtener mi código de entrega' });
  fin.addEventListener('click', function () { guard(fin, async function () {
    var r = await api('final', { salidas: st.salidas, bloqueos: st.bloqueos });
    if (!r.s) { toast('No se pudo cerrar el intento (' + r.e + ').'); return; }
    applyState(r); save(); render();
  }); });
  if (!st.done) { card.appendChild(el('p', { text: 'Total: ' + total + ' de 18 estrellas.' })); card.appendChild(el('div', { class: 'acts' }, [fin])); return; }
  card.appendChild(el('p', {}, [el('b', { text: 'Total: ' + total + ' de 18 estrellas · Nota: ' + st.nota.toFixed(1) + ' / 5.0' })]));
  card.appendChild(el('h3', { text: 'Tu código de entrega' }));
  card.appendChild(el('div', { class: 'code-final permitir', text: st.code }));
  card.appendChild(el('p', { class: 'meta', text: 'Escríbelo en la plataforma del curso tal cual. Tu docente lo contrasta con el registro del laboratorio.' }));
  var pdf = el('button', { text: 'Descargar informe en PDF' });
  pdf.addEventListener('click', function () { guard(pdf, makePdf); });
  var again = el('button', { class: 'sec', text: 'Hacer un nuevo intento' });
  again.addEventListener('click', function () { guard(again, async function () {
    if (!confirm('Se genera un token y datos nuevos. Se conserva tu mejor resultado por misión. ¿Continuar?')) return;
    var r = await api('reset', {});
    if (!r.s) { toast('No se pudo reiniciar.'); return; }
    st.drafts = {}; st.hints = {}; applyState(r); st.view = 'm'; st.cur = 1; save(); render();
  }); });
  card.appendChild(el('div', { class: 'acts' }, [pdf, again]));
}
function fechaTxt() { return new Date().toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' }); }
function pdfFooter(doc, page) {
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(60);
  doc.text(st.name + '  |  Grupo ' + st.group + '  |  Código de entrega: ' + st.code, 40, 820);
}
function drawReport(doc, pie) {
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(75, 46, 131);
  doc.text('Laboratorio de Machine Learning', 40, 60);
  doc.setFontSize(11); doc.setTextColor(60); doc.setFont('helvetica', 'normal');
  doc.text('Inteligencia Artificial · Unidad 4 · Informe individual', 40, 80);
  var y = 120; var lin = function (t, b) { doc.setFont('helvetica', b ? 'bold' : 'normal'); doc.setFontSize(12); doc.setTextColor(30); doc.text(t, 40, y); y += 22; };
  lin('Estudiante: ' + st.name, true); lin('Grupo: ' + st.group); lin('Intento: ' + st.attempt + '   |   Fecha: ' + fechaTxt()); y += 10;
  lin('Resultado por misión', true);
  var total = 0;
  for (var i = 1; i <= 6; i++) { total += st.stars[i - 1]; lin(TITULOS[i][0].replace(' · ', ': ') + '   -   ' + st.stars[i - 1] + ' de 3 estrellas'); }
  y += 10; lin('Total: ' + total + ' de 18 estrellas', true); lin('Nota: ' + st.nota.toFixed(1) + ' / 5.0', true); y += 16;
  doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(90);
  var nota = doc.splitTextToSize('La validez de este informe la da el código de entrega, que el docente contrasta con el registro del laboratorio. Un PDF modificado o sin ese código no es válido.', 510);
  doc.text(nota, 40, y);
  if (pie) pdfFooter(doc);
}
async function makePdf() {
  var J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast('No se cargó la librería de PDF. Revisa tu conexión.'); return; }
  var clave = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(12)), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  var nombre = 'Informe_ML_' + st.name.replace(/[^\wÁÉÍÓÚÑáéíóúñ]+/g, '_') + '.pdf';
  var opts = { unit: 'pt', format: 'a4', encryption: { userPassword: '', ownerPassword: clave, userPermissions: ['print', 'copy'] } };
  try {
    if (!window.pdfjsLib) throw new Error('sin pdf.js');
    var plano = new J({ unit: 'pt', format: 'a4' }); drawReport(plano, false);
    var buf = plano.output('arraybuffer');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDF_WORKER || 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    var doc = new J(opts);
    for (var p = 1; p <= pdf.numPages; p++) {
      var page = await pdf.getPage(p), vp = page.getViewport({ scale: 2 });
      var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      if (p > 1) doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 595.28, 841.89);
      pdfFooter(doc);   // texto real del pie, para copiar el código sin errores
    }
    doc.save(nombre);
  } catch (e) {
    var d2 = new J(opts); drawReport(d2, true); d2.save(nombre);
    toast('Informe generado en versión de texto (cifrado), con el mismo código.');
  }
}

/* ===== Disuasión ===== */
function watermark() {
  if (!st.name) return;
  var t = (st.name + ' · ' + st.group).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='360' height='200'><text x='20' y='110' transform='rotate(-25 180 100)' font-family='Arial' font-size='20' fill='#000'>" + t + "</text></svg>";
  $('wm').style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}
function enLaboratorio() { return !!st.sid && !!st.name; }
function misionEnCurso() { return st.view === 'm' && (st.cur === 1 || st.cur === 5); }
function cubrible() { return enLaboratorio() && (st.view === 'summary' || misionEnCurso()); }   /* M2-M4 requieren Colab: no se cubre */
function setAway(a) {
  if (a && cubrible()) {
    if (!$('cover').classList.contains('on') && misionEnCurso()) { st.salidas++; st.bloqueos++; save(); }
    $('cover').classList.add('on');
  }
}
document.addEventListener('visibilitychange', function () { if (document.hidden) setAway(true); });
window.addEventListener('blur', function () { setAway(true); });
$('cov-btn').addEventListener('click', function () { $('cover').classList.remove('on'); });
function permitido(t) { return t && t.closest && t.closest('input,select,textarea,.permitir'); }
['contextmenu', 'dragstart', 'selectstart'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { if (!permitido(e.target)) e.preventDefault(); });
});
['copy', 'cut'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (!permitido(e.target)) e.preventDefault(); }); });
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && /^[pus]$/i.test(e.key)) e.preventDefault();
});

/* ===== Inicio ===== */
loadLocal();
if (st.sid && st.name) { st.view = st.done ? 'summary' : 'm'; } else st.view = 'start';
watermark(); render();
if (st.sid && st.name && API_URL) {   /* re-sincroniza con el servidor al recargar */
  api('start', { name: st.name, group: st.group, sid: undefined }).then(function (r) {
    if (r && r.s) { applyState(r); if (st.view !== 'start') { st.view = st.done ? 'summary' : 'm'; } save(); render(); }
  }).catch(function () {});
}
window.__lab = { get st() { return st; } };
})();
</script>
