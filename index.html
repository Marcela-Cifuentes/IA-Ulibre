<style>
:root{
  --bg:#f3f7fc; --card:#ffffff; --ink:#13203a; --muted:#56647a; --line:#d6e0ee;
  --brand:#1d6fe0; --brand2:#0f55b8; --soft:#e7f0fd; --ok:#15803d; --okbg:#e2f6ea; --bad:#c62828; --badbg:#fde8e8;
  --warn:#92580a; --warnbg:#fff3d1; --star:#e5a100; --code:#edf3fa; --hdr:#0f4fb0;
  --m-ex:#2563eb; --m-pr:#16a34a; --m-re:#ea580c; --m-es:#0891b2; --m-f1:#db2777;
  --cvp:#16a34a; --cvn:#2563eb; --cfp:#d97706; --cfn:#dc2626;
}
:root[data-theme="dark"]{
  --bg:#0d1420; --card:#161f2f; --ink:#e8eef8; --muted:#9db0c8; --line:#2a3a52;
  --brand:#6aa8ff; --brand2:#8dbcff; --soft:#1a2b46; --ok:#5fdc95; --okbg:#12301f; --bad:#ff9a92; --badbg:#3a1a1a;
  --warn:#f3c969; --warnbg:#3a2e12; --star:#f1c240; --code:#1c2a3f; --hdr:#12263f;
  --m-ex:#6aa8ff; --m-pr:#4ade80; --m-re:#fb923c; --m-es:#22d3ee; --m-f1:#f472b6;
  --cvp:#4ade80; --cvn:#60a5fa; --cfp:#fbbf24; --cfn:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea,.permitir{-webkit-user-select:text;user-select:text}
header.top{background:var(--hdr);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:1rem;margin:0;font-weight:650;flex:1;min-width:200px}
header.top .who{font-size:.85rem;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.steps{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.step{flex:1;min-width:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:.78rem;text-align:center;color:var(--muted)}
.step b{display:block;font-size:.95rem;color:var(--ink)}
.step.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft);color:var(--brand)}
.step.done{background:var(--okbg);border-color:var(--ok)}
.stars{color:var(--star);letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.25rem}
.card h3{margin:16px 0 6px;font-size:1rem}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.callout{background:var(--soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.callout.warn{background:var(--warnbg);border-color:var(--warn);color:var(--ink)}
.callout.bad{background:var(--badbg);border-color:var(--bad)}
.callout.ok{background:var(--okbg);border-color:var(--ok)}
label.f{display:block;font-weight:600;margin:10px 0 4px;font-size:.95rem}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-height:44px}
input:focus,select:focus{outline:3px solid var(--soft);border-color:var(--brand)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.field.bad input,.field.bad select,.item.bad{border-color:var(--bad)}
.item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.item.bad{background:var(--badbg)}
.item p{margin:0 0 8px}
.explica{font-size:.9rem;margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:8px}
.q{margin:14px 0}
.q .t{font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;min-height:44px}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.q.bad .opt{border-color:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--brand);background:var(--brand);color:#fff;padding:10px 16px;min-height:44px;font-weight:600}
html[data-theme="dark"] button{color:#0d1420}
html[data-theme="dark"] button.sec{color:var(--brand)}
button.sec{background:transparent;color:var(--brand)}
button.link{background:none;border:none;color:var(--brand);text-decoration:underline;padding:6px 4px;min-height:0;font-weight:500}
button:disabled{opacity:.55;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.token{font:700 1.5rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;background:var(--code);border:2px dashed var(--brand);border-radius:12px;padding:10px 16px;display:inline-block}
.pasos{counter-reset:p;list-style:none;padding:0;margin:8px 0}
.pasos li{counter-increment:p;position:relative;padding:6px 0 6px 38px}
.pasos li:before{content:counter(p);position:absolute;left:0;top:5px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;text-align:center;line-height:26px;font-size:.85rem}
html[data-theme="dark"] .pasos li:before{color:#0d1420}
code,.cod{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 6px;border-radius:5px;font-size:.92em}
.hint{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--warnbg);font-size:.92rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.code-final{font:800 2.2rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;color:var(--brand);background:var(--soft);border-radius:14px;padding:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;font-size:.92rem}
#cover{position:fixed;inset:0;background:var(--hdr);color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#cover.on{display:flex}
#cover div{max-width:420px}
#wm{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.07}
@media print{body{display:none!important}}
.sr{position:absolute;left:-9999px}
#theme{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.55);min-height:36px;padding:4px 12px;font-size:.85rem}
.ph{display:flex;align-items:center;gap:8px;margin:22px 0 4px!important;font-size:1.05rem!important;color:var(--mc,var(--ink))}
.pn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--mc,var(--brand));color:#fff;font-size:.85rem;font-weight:700}
html[data-theme="dark"] .pn{color:#0d1420}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.pg{font-size:.8rem;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--card)}
.pg.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg);font-weight:600}
details.teo{border:1.5px solid var(--line);border-left:6px solid var(--mc,var(--brand));border-radius:12px;padding:4px 14px;margin:10px 0;background:var(--card)}
details.teo summary{cursor:pointer;font-weight:650;padding:8px 0;color:var(--mc,var(--brand))}
.cvp{--c:var(--cvp)}.cvn{--c:var(--cvn)}.cfp{--c:var(--cfp)}.cfn{--c:var(--cfn)}
.mx{border-collapse:separate;border-spacing:5px;width:auto;margin:8px 0;font-size:.9rem}
.mx th{border:none;padding:4px 8px;font-weight:600;color:var(--muted);text-align:center;font-size:.8rem}
.mx td{border:2px solid var(--c,var(--line));border-radius:10px;text-align:center;padding:8px 10px;min-width:86px;font-weight:700;background:color-mix(in srgb,var(--c,var(--line)) 16%,var(--card))}
.mx td .cn{display:block;color:var(--c);font-size:.9rem}
.mx td.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.mx td.on{outline:3px solid var(--c);outline-offset:1px}
.mx td[data-c]{cursor:pointer}
.mx input{width:80px;text-align:center;font-weight:700;padding:6px;min-height:40px}
.mx.mini td{--c:var(--line);background:transparent;min-width:66px;padding:5px 8px;font-size:.85rem}
.mx.mini td .cn{color:var(--muted)}
.mx.mini td.num{background:var(--mc);border-color:var(--mc);border-style:solid}
.mx.mini td.num .cn,.mx.mini td.num small{color:#fff}
html[data-theme="dark"] .mx.mini td.num .cn,html[data-theme="dark"] .mx.mini td.num small{color:#0d1420}
.mx.mini td.den{background:color-mix(in srgb,var(--mc) 20%,var(--card));border:2px dashed var(--mc)}
.mx.mini td.den .cn{color:var(--ink)}
.mx.mini td.off{opacity:.4}
.mx.mini td small{display:block;font-weight:500}
.info{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--soft);border-left:5px solid var(--c,var(--brand));font-size:.93rem}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.stp{border:2px solid var(--c);border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--c) 12%,var(--card))}
.stp b{color:var(--c)}.stp small{display:block;color:var(--muted);font-size:.78rem}
.stp .acts{margin-top:6px;gap:6px;flex-wrap:nowrap}
.sv{font-weight:800;font-size:1.2rem;min-width:30px;text-align:center}
button.sm{padding:4px 12px;min-height:36px;font-size:.9rem}
.barrow{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.barrow b{color:var(--mc)}
.bar{height:14px;background:var(--code);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--mc);border-radius:99px;transition:width .6s ease}
.bv{font-weight:700;text-align:right}
tr.cvp td,tr.cvn td,tr.cfp td,tr.cfn td{background:color-mix(in srgb,var(--c) 16%,var(--card))}
tr.bad td{background:var(--badbg)!important}
.cap{display:block;font-size:.76rem;color:var(--c,var(--muted));font-weight:600;margin-top:2px}
.sumcheck{font-size:.9rem;margin-top:4px;color:var(--muted)}
.sumcheck.good{color:var(--ok);font-weight:700}
.mcard{border:1.5px solid var(--line);border-top:6px solid var(--mc);border-radius:12px;padding:12px;margin:12px 0;background:var(--card)}
.mcard.bad,.mcard .field.bad{border-color:var(--bad)}
.mcard h4{margin:0 0 2px;font-size:1.02rem;display:flex;align-items:center;gap:8px;color:var(--mc)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mc)}
.mcard .q1{margin:0 0 6px;color:var(--muted);font-size:.92rem}
.mcard .fm{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:4px 8px;border-radius:6px;display:inline-block;margin:4px 0;font-size:.92rem}
.mcard .res{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--mc) 14%,var(--card));border-left:5px solid var(--mc);font-size:.92rem}
.mini-help{margin:6px 0;font-size:.9rem}.mini-help summary{cursor:pointer;color:var(--mc);font-weight:600}
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:8px 0}
.pool{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:60px}
.pool.over,.slot.over{border-color:var(--brand);background:var(--soft)}
.ptit{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.chip{border:2px solid var(--brand);background:var(--card);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.9rem;cursor:grab;touch-action:none;line-height:1.35}
.chip.sel{background:var(--soft);box-shadow:0 0 0 3px var(--brand)}
.chip.lift{opacity:.35}
.chip.ghost{position:fixed;z-index:200;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.3);opacity:.95;margin:0}
.dmet{display:grid;grid-template-columns:1fr;gap:8px;border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:var(--card)}
@media(min-width:640px){.dmet{grid-template-columns:150px 1fr 1fr}}
.dn{font-weight:700;color:var(--ink);display:flex;flex-direction:column;gap:2px}.dn small{color:var(--muted);font-weight:500;font-size:.78rem}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:10px;padding:4px 6px;display:flex;align-items:center}
.slot .ph2{color:var(--muted);font-size:.82rem}
.slot.full .ph2{display:none}.slot.full{border-style:solid}
.slot .chip{margin:0;width:100%}
.slot.bad{border-color:var(--bad);background:var(--badbg)}
.tcards{display:grid;gap:10px;margin:8px 0}
.tcard{border:2px solid var(--mc);border-radius:12px;background:color-mix(in srgb,var(--mc) 8%,var(--card));overflow:hidden}
.thead{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 12px;cursor:pointer}
.thead b{display:block;color:var(--mc);font-size:1.02rem}.thead small{display:block;color:var(--ink)}
.thead .mas{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.tbody{display:none;padding:0 12px 6px}.tcard.open .tbody{display:block}.tbody p{margin:6px 0;font-size:.92rem}
.camino{display:grid;gap:6px;margin:6px 0}
.cn{border-radius:10px;padding:8px 10px;font-size:.92rem}
.cn.q{background:var(--soft);border:1.5px solid var(--line)}
.cn.r{background:var(--mc);color:#fff;font-weight:700;display:inline-block}
html[data-theme="dark"] .cn.r{color:#0d1420}
.cr{display:flex;align-items:center;gap:8px;margin-left:14px}
.si{font-weight:700;color:var(--ok);font-size:.85rem}.si.no{color:var(--bad)}
.cal-q{font-weight:650;margin:8px 0}
.info.bien{border-left-color:var(--ok);background:var(--okbg)}.info.mal{border-left-color:var(--bad);background:var(--badbg)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{--mc:var(--brand);background:transparent;color:var(--mc);border:2px solid var(--mc);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:600;font-size:.9rem}
.pill.on{background:var(--mc);color:#fff}
html[data-theme="dark"] .pill.on{color:#0d1420}
.recu{margin-top:8px;font-size:.85rem;color:var(--muted)}
.frase{line-height:2;margin:4px 0 10px}
.seg{cursor:pointer;border-bottom:2px dashed var(--brand);padding:2px 4px;border-radius:5px}
.seg:hover{background:var(--soft)}
.seg.on{background:var(--brand);color:#fff;border-bottom-style:solid}
html[data-theme="dark"] .seg.on{color:#0d1420}
.locked .seg{pointer-events:none}
button.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--line)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.fl{border:2px solid var(--line);border-radius:12px;padding:8px 10px;position:relative;background:var(--card);display:flex;flex-direction:column;gap:2px}
.fl.aqui{border-color:var(--brand)}.fl.colab{border-color:var(--m-re);border-style:dashed}
.fl .fn{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--card);font-weight:800;font-size:.8rem;display:grid;place-items:center}
.fl small{color:var(--muted);font-size:.8rem}
.anota-mock{border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--soft)}
.anota-mock pre{margin:4px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;white-space:pre-wrap;color:var(--ink)}
.am-t{font-size:.82rem;color:var(--muted)}
.locked .pill{pointer-events:none}
.revbox{margin:8px 0}.revmsg .callout{margin:8px 0 0}
.item.good,.q.good,.mcard.good,.dmet.good,.field.good{border-color:var(--ok)}
.field.good input,.field.good select{border-color:var(--ok)}
.slot.good{border-color:var(--ok);background:var(--okbg)}
tr.good td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.mx td.good{border-color:var(--ok)!important}
.locked .chip,.locked .slot{pointer-events:none}
.locked .chip{cursor:default}
.tbl td,.tbl th{padding:6px 8px}


/* ===== Capa visual v2 (solo presentación; no cambia la lógica) ===== */
:root{
  --a1:#2563eb; --a2:#16a34a; --a3:#7c3aed; --a4:#ea580c; --a5:#0891b2; --a6:#db2777;
  --shadow:0 1px 2px rgba(15,35,70,.06),0 10px 28px rgba(15,35,70,.08);
  --ring:0 0 0 3px color-mix(in srgb,var(--brand) 38%,transparent);
}
:root[data-theme="dark"]{
  --a1:#6aa8ff; --a2:#4ade80; --a3:#a78bfa; --a4:#fb923c; --a5:#22d3ee; --a6:#f472b6;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.38);
}
body{background:radial-gradient(1100px 460px at 88% -140px,color-mix(in srgb,var(--brand) 16%,transparent),transparent 70%),var(--bg)}
header.top{background:linear-gradient(120deg,var(--hdr),color-mix(in srgb,var(--hdr) 62%,#5b3fd1));box-shadow:0 2px 16px rgba(15,35,70,.28);position:sticky;top:0;z-index:40}
header.top h1{display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.logo{width:30px;height:30px;flex:none}
.card{box-shadow:var(--shadow);border-top:5px solid var(--acc,var(--brand));animation:rise .38s ease both}
.card[data-m] h2{color:var(--acc)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ruta de misiones */
.steps{gap:8px}
.step{position:relative;overflow:hidden;border-radius:12px;padding-top:10px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.step:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--line);transition:background .3s}
.step.done:before,.step.cur:before{background:var(--sc)}
.step.done{background:color-mix(in srgb,var(--sc) 11%,var(--card));border-color:var(--sc)}
.step.cur{transform:translateY(-3px);border-color:var(--sc);color:var(--ink);box-shadow:0 8px 18px color-mix(in srgb,var(--sc) 30%,transparent)}
.step b{color:var(--sc)}
.step small{display:block;font-size:.68rem;line-height:1.15;color:var(--muted);margin:1px 0 2px}
.trk{height:8px;border-radius:99px;background:var(--code);overflow:hidden;margin:-4px 0 16px}
.trk span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a3),var(--a6));transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* botones y enlaces */
.acts button,.revbox button,#cov-btn,a.btnlink{transition:transform .12s,box-shadow .15s,background .15s,opacity .15s}
.acts button:hover:not(:disabled),.revbox button:hover:not(:disabled),a.btnlink:hover{transform:translateY(-1px);box-shadow:0 5px 14px color-mix(in srgb,var(--brand) 28%,transparent)}
.acts button:active:not(:disabled),.revbox button:active:not(:disabled){transform:none;box-shadow:none}
button:focus-visible,a.btnlink:focus-visible,.seg:focus-visible,.chip:focus-visible,summary:focus-visible,.thead:focus-visible{outline:none;box-shadow:var(--ring)}
a.btnlink{display:inline-flex;align-items:center;gap:8px;font-weight:600;border:1.5px solid var(--brand);color:var(--brand);border-radius:10px;padding:10px 16px;min-height:44px;text-decoration:none;background:transparent}
a.btnlink:hover{background:var(--soft)}
.opt{transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:var(--brand);transform:translateX(2px)}
.item,.mcard,.dmet,.tcard{transition:border-color .2s,background .2s,box-shadow .2s}

    var doc = new J(opts);
    for (var p = 1; p <= pdf.numPages; p++) {
      var page = await pdf.getPage(p), vp = page.getViewport({ scale: 2 });
      var cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      if (p > 1) doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 595.28, 841.89);
      pdfFooter(doc);   // texto real del pie, para copiar el código sin errores
    }
    doc.save(nombre);
  } catch (e) {
    var d2 = new J(opts); drawReport(d2, true); d2.save(nombre);
    toast('Informe generado en versión de texto (cifrado), con el mismo código.');
  }
}

/* ===== Disuasión ===== */
function watermark() {
  if (!st.name) return;
  var t = (st.name + ' · ' + st.group).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='360' height='200'><text x='20' y='110' transform='rotate(-25 180 100)' font-family='Arial' font-size='20' fill='#000'>" + t + "</text></svg>";
  $('wm').style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}
function enLaboratorio() { return !!st.sid && !!st.name; }
function misionEnCurso() { return st.view === 'm' && (st.cur === 1 || st.cur === 5 || st.cur === 6); }
function cubrible() { return enLaboratorio() && (st.view === 'summary' || misionEnCurso()); }   /* M2-M4 requieren Colab: no se cubre */
function setAway(a) {
  if (a && cubrible()) {
    if (!$('cover').classList.contains('on') && misionEnCurso()) { st.salidas++; st.bloqueos++; save(); }
    $('cover').classList.add('on');
  }
}
document.addEventListener('visibilitychange', function () { if (document.hidden) setAway(true); });
window.addEventListener('blur', function () { setAway(true); });
$('cov-btn').addEventListener('click', function () { $('cover').classList.remove('on'); });
function permitido(t) { return t && t.closest && t.closest('input,select,textarea,.permitir'); }
['contextmenu', 'dragstart', 'selectstart'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { if (!permitido(e.target)) e.preventDefault(); });
});
['copy', 'cut'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (!permitido(e.target)) e.preventDefault(); }); });
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && /^[pus]$/i.test(e.key)) e.preventDefault();
});

/* ===== Inicio ===== */
loadLocal();
if (st.sid && st.name) { st.view = st.done ? 'summary' : 'm'; } else st.view = 'start';
watermark(); render();
if (st.sid && st.name && API_URL) {   /* re-sincroniza con el servidor al recargar */
  api('start', { name: st.name, group: st.group, sid: undefined }).then(function (r) {
    if (r && r.s) { applyState(r); if (st.view !== 'start') { st.view = st.done ? 'summary' : 'm'; } save(); render(); }
  }).catch(function () {});
}
window.__lab = { get st() { return st; } };
})();
</script>
